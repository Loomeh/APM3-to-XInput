; Copy this to APM3-to-XInput.ini next to the exe and fill it in.
;
; Each [section] is one virtual controller, four at most. The section name can be
; anything. Two sections can use the same Device, for example one board with two sticks.
;
; Device: run "APM3-to-XInput.exe --list" to see the device instance path of every
; connected game controller. It may change if you plug the device into another USB port.
;
; Left of the =: A B X Y LB RB LS RS Up Down Left Right Start Back LT RT
; Anything you leave out is simply not used.
;
; Right of the =, whichever the Windows game controller test shows the input as:
;   A number      button number:   A=1
;   Axis + or -   axis direction:  Left=X-   Right=X+   (X Y Z Rx Ry Rz Slider Dial)
;   Hat:Direction hat direction:   Up=Hat:Up            (Up Down Left Right)
;
; LT and RT can also follow an axis, from released at its lowest value to fully pulled
; at its highest: LT=Z. With a button or direction they are either released or fully
; pulled.
;
; Inputs that aren't mapped here are ignored completely.

[Controller1]
Device=HID\VID_0000&PID_0000\REPLACE_WITH_PATH_FROM_LIST
A=1
B=2
X=3
Y=4
LB=5
RB=6
LT=9      ; or an axis, such as LT=Z
RT=10     ; or an axis, such as RT=Rz
Up=Hat:Up
Down=Hat:Down
Left=Hat:Left
Right=Hat:Right
Start=7
Back=8
